<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>FreakyMustard — Watch English & Tamil Movies Online</title>
    <meta name="description" content="FreakyMustard is a fast, beautiful streaming portal for the latest English movies & series and Tamil movies. Search, watch, and keep track of your watchlist." />
    <meta name="keywords" content="stream movies, watch english movies, watch tamil movies, series, streaming portal" />
    <meta name="author" content="Abhishek" />
    <meta name="theme-color" content="#05070d" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FreakyMustard" />
    <meta property="og:title" content="FreakyMustard — Watch English & Tamil Movies Online" />
    <meta property="og:description" content="A fast, beautiful streaming portal for the latest English movies & series and Tamil movies." />
    <meta property="og:image" content="/og-cover.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FreakyMustard — Watch English & Tamil Movies Online" />
    <meta name="twitter:description" content="A fast, beautiful streaming portal for the latest English movies & series and Tamil movies." />
    <meta name="twitter:image" content="/og-cover.png" />

    <!-- Icons / PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Performance: warm up connections before we need them -->
    <link rel="preconnect" href="https://moviesda-backend.onrender.com" />
    <link rel="preconnect" href="https://images.metahub.space" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Inline first-paint splash (replaced as soon as React mounts) -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#05070d;font-family:Inter,system-ui,sans-serif">
        <div style="width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#3b6cf6,#7c3aed);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 40px rgba(59,108,246,.45)">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M8 5.5v13l11-6.5-11-6.5z"/></svg>
        </div>
        <div style="color:#64748b;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase">Loading FreakyMustard…</div>
      </div>
    </div>
    <noscript>
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05070d;color:#e2e8f0;font-family:sans-serif;padding:24px;text-align:center">
        FreakyMustard requires JavaScript to stream content. Please enable JavaScript and reload.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
