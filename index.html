<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>FreakyMustard — An Editorial Streaming Journal</title>
    <meta name="description" content="FreakyMustard is a printed-page streaming journal for English films, series and Tamil cinema. Read the catalogue, watch, keep a list." />
    <meta name="keywords" content="stream movies, watch english movies, watch tamil movies, series, streaming journal" />
    <meta name="author" content="Abhishek" />
    <meta name="theme-color" content="#F6F3EC" />
    <meta name="color-scheme" content="light" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FreakyMustard" />
    <meta property="og:title" content="FreakyMustard — An Editorial Streaming Journal" />
    <meta property="og:description" content="English films, series and Tamil cinema, set like a printed film journal." />
    <meta property="og:image" content="/og-cover.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FreakyMustard — An Editorial Streaming Journal" />
    <meta name="twitter:description" content="English films, series and Tamil cinema, set like a printed film journal." />
    <meta name="twitter:image" content="/og-cover.png" />

    <!-- Icons / PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Type: one serif display + one grotesk body. Mono falls back to system. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Inline first-paint splash (replaced as soon as React mounts) -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#F6F3EC;font-family:Georgia,serif">
        <div style="font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#7A7368">FreakyMustard</div>
        <div style="font-size:28px;font-weight:900;color:#1A1512">Setting the type…</div>
        <div style="width:120px;height:2px;background:#DCD4C2"></div>
      </div>
    </div>
    <noscript>
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#F6F3EC;color:#1A1512;font-family:Georgia,serif;padding:24px;text-align:center">
        FreakyMustard requires JavaScript to stream content. Please enable JavaScript and reload.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
